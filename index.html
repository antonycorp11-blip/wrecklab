<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1d33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Esfrega! — um incremental aconchegante de faxina em pixel art." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Esfrega!</title>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <header id="top">
      <div class="logo">ESFREGA<span>!</span></div>
      <div class="cur" title="Pó"><span>🧹</span><b id="t-po">0</b></div>
      <div class="cur" title="Brilho"><span>🌟</span><b id="t-brilho">0</b></div>
      <nav>
        <button data-go="board" title="Quadro de clientes">📌</button>
        <button data-go="tree" title="Habilidades">🌳<i id="b-tree"></i></button>
        <button data-go="settings" title="Ajustes">⚙️</button>
      </nav>
    </header>
    <section id="board" class="hidden"></section>
    <section id="sheet" class="panel hidden"></section>
    <section id="hud" class="hidden"></section>
    <section id="summary" class="panel hidden"></section>
    <div id="toasts"></div>
    <div id="modal" class="hidden"></div>
    <section id="tree" class="hidden">
      <canvas id="tree-canvas"></canvas>
      <div id="tree-top"><button id="tree-close" class="x">✕</button><b>HABILIDADES</b><div id="tree-res"></div></div>
      <div id="tree-info"></div>
    </section>
    <div id="rotate"><div class="ph">📱</div><p>Gire o celular<br>para a horizontal</p></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
